<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript</title>
    <link rel="stylesheet" href="js intro.css" />
  </head>

  <body>
    <button>Click Me!</button>;
    <div class="feild">
      <div class="form-description">
        <h1 style="padding-left: 8em; color: cyan; margin-top: 3em">
          Expense Calculator
        </h1>
        <p id="msg1"></p>
        <label for="Rent">Rent</label>
        <input
          type="text"
          name="Rent"
          id="rent"
          oninput="calculate()"
          value="0"
        />
        <label for="Feeding">Feeding</label>
        <input
          type="text"
          name="feeding"
          id="feeding"
          oninput="calculate()"
          value="0"
        />
        <label for="Transport">Transport</label>
        <input
          value="0"
          type="text"
          name="transport"
          id="transport"
          oninput="calculate()"
        />
        <lable for="Bills">Bills</lable>
        <input
          type="text"
          name="bills"
          id="bills"
          oninput="calculate()"
          value="0"
        />
        <lable for="Clothing">Clothing</lable>
        <input
          value="0"
          type="text"
          name="clothing"
          id="clothing"
          oninput="calculate()"
        />
        <lable for="Enjoyment">Enjoyment</lable>
        <input
          value="0"
          type="text"
          name="enjoyment"
          name="enjoyment"
          id="enjoyment"
          oninput="calculate()"
        />
        <lable for="Parent">Parents</lable>
        <input
          type="text"
          name="Parents"
          id="Parents"
          oninput="calculate()"
          value="0"
        />
        <lable for="Data">Data</lable>
        <input
          type="text"
          name="data"
          id="data"
          oninput="calculate()"
          value="0"
        />
        <lable for="Social">Social</lable>
        <input
          type="text"
          name="social"
          id="social"
          oninput="calculate()"
          value="0"
        />
        <lable for="Tax">Tax</lable>
        <input
          type="text"
          name="tax"
          id="tax"
          oninput="calculate()"
          value="0"
        />
      </div>
    </div>
    <div
      style="display: flex; flex-direction: column; margin: 16em; gap: 0.5em"
    >
      <hr />
      <label for="expenses">Total Expenses</label>
      <input
        type="text"
        name="Expenses"
        id="texpenses"
        readonly="true"
        oninput="calculate()"
      />
      <hr />
      <label for="income">Income</label>
      <hr />
      <input
        type="text"
        name="income"
        id="income"
        oninput="calculate()"
        value="0"
      />
      <hr />
      <label for="balance">Balnace</label>
      <hr />
      <input
        type="text"
        name="balance"
        id="balance"
        readonly="true"
        oninput="calculate()"
      />
      <hr />
    </div>
    <div
      style="display: flex; flex-direction: column; margin: 16em; gap: 0.5em"
    >
      <h2>Personal Details</h2>
      <label for="First Name">First Name</label>
      <input type="text" name="First Name" id="FName" onchange="message();" required />
      <label for="Last Name">Last Name</label>
      <input type="text" name="Last Name" id="LName" onchange="message();" required />
      <label for="Address">Address</label>
      <textarea rows="4" colums="6" name="Address" id="Address"></textarea>
      <label for="Phone">Phone</label>
      <input type="number" name="phone" id="phone" />
      <label for="Title">Tittle</label>
      <select name="Title" id="Title">
        <option value="Mr">Mr</option>
        <option value="Mr's">Mr's</option>
        <option value="Miss">Miss</option>
      </select>
    </div>
  </body>
  <script>
    alert("Hello World");
    function calculate() {
      var rent = document.getElementById("rent").value;
      var feeding = document.getElementById("feeding").value;
      var transport = document.getElementById("transport").value;
      var bills = document.getElementById("bills").value;
      var clothing = document.getElementById("clothing").value;
      var enjoyment = document.getElementById("enjoyment").value;
      var parents = document.getElementById("Parents").value;
      var data = document.getElementById("data").value;
      var social = document.getElementById("social").value;
      var tax = document.getElementById("tax").value;
      var Income = document.getElementById("income").value;

      var total_expenses =
        parseInt(rent) +
        parseInt(feeding) +
        parseInt(transport) +
        parseInt(bills) +
        parseInt(clothing) +
        parseInt(enjoyment) +
        parseInt(parents) +
        parseInt(data) +
        parseInt(social) +
        parseInt(tax);
      console.log("Total Expenses is:" + total_expenses);
      document.getElementById("texpenses").value = total_expenses;

      var Balance = parseInt(Income) - parseInt(total_expenses);

      document.getElementById("balance").value = Balance;
    }
    function message() {
      var Title = document.getElementById("Title").value;
      var FirstName = document.getElementById("FName").value;
      var LastName = document.getElementById("LName").value;
      var Expenses = document.getElementById("texpenses").value;
      var Income = document.getElementById("income").value;
      var Balance = document.getElementById("balance").value;
      var textmsg =
        "Hello " +
        Title +
        "  " +
        FirstName +
        "  " +
        LastName +
        " Your Earned  " +
        Income +
        " CFA, and spent  " +
        Expenses +
        "  CFA, Your Savings is  " +
        Balance +
        ".  Thank you and see you next month";
        

        document.getElementById("msg1").innerHTML=textmsg;
    }
  </script>
</html>
